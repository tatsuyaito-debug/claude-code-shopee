# =============================================================================
# 誰が梱包して発送するか（発送主体）の設定
# -----------------------------------------------------------------------------
# active: を切り替えると、利益計算・作業フロー・リードタイムがまとめて変わります。
#
#   self       … 自分で梱包して、自分でSLS倉庫に送る
#   shopeeking … ShopeeKing（株式会社ten.）の発送代行に任せる
#
# ★重要: 代行の料金は契約プランで変わります。ここの数字は仮です。
#   ShopeeKing の管理画面 / 契約書 / 見積りの実数に必ず置き換えてください。
#   置き換えたら updated_at も直すこと（古いと計算スクリプトが警告します）。
# =============================================================================

active: self

providers:
  # ---------------------------------------------------------------------------
  # 自社発送：自分で梱包し、SLS集荷倉庫へ持ち込む／集荷してもらう
  # ---------------------------------------------------------------------------
  self:
    name_ja: 自社発送（自分で梱包）
    updated_at: 2026-09-21
    per_unit:                      # 1個あたりにかかる費用（円）
      inbound_jpy: 0               # 入庫料。自社発送では発生しない
      pick_pack_jpy: 0             # 梱包作業料。自分の手間なので現金は出ない
      material_jpy: 60             # 梱包資材（OPP袋・封筒・緩衝材）
      domestic_to_sls_jpy: 300     # 仕入れ先→自宅→SLS倉庫 までの国内送料（1個按分）
    inbound_shipping_jpy_per_lot: 0  # 代行倉庫への納品送料。自社発送では不要
    lot_size: 1
    monthly_fixed_jpy: 0           # 月額固定費
    expected_monthly_units: 1      # 月額固定費を按分する想定出荷数
    handling_days: 2               # 注文から発送までのリードタイム（日）
    labor_minutes_per_order: 8     # 1注文あたり自分が使う時間（分）
    note: |
      現金の支出は少ないが、梱包・発送に自分の時間を使う。
      出荷が月20件を超えたあたりから、この時間が新規出品の時間を食い始める。

  # ---------------------------------------------------------------------------
  # ShopeeKing 発送代行（株式会社ten.）
  # 商品を代行倉庫にまとめて納品 → 梱包・ラベル貼付・SLS倉庫への発送を代行
  # ---------------------------------------------------------------------------
  shopeeking:
    name_ja: ShopeeKing 発送代行
    updated_at: 2026-09-21
    per_unit:                      # ★すべて契約の実数に要更新
      inbound_jpy: 0               # 入庫料（倉庫で受け取ってもらう費用）／個
      pick_pack_jpy: 0             # 梱包・ラベル貼付の代行料／個
      material_jpy: 0              # 資材費（プチプチ・段ボール）／個
      domestic_to_sls_jpy: 0       # 代行倉庫→SLS倉庫 の国内送料／個
    # 仕入れた商品を代行倉庫へまとめて送るときの送料。lot_size 個で割って按分する。
    inbound_shipping_jpy_per_lot: 0   # ★1回の納品にかかる送料
    lot_size: 20                      # ★1回に何個まとめて納品するか
    monthly_fixed_jpy: 0              # ★月額サブスク料金
    expected_monthly_units: 50        # ★月に何個出荷する想定か（月額をこれで割って按分）
    handling_days: 1                  # ★代行の出荷リードタイム
    labor_minutes_per_order: 1        # 出荷指示の確認程度。手は動かさない
    note: |
      現金の支出は増えるが、梱包・発送の時間が丸ごと空く。
      空いた時間を新規出品に回せるかどうかが、元を取れるかの分かれ目。
      月額固定費があるので、出荷数が少ないうちは1個あたりの負担が重い。
      scripts/compare_fulfillment.py で「月何個から得になるか」を確認できる。
