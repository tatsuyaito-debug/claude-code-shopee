# =============================================================================
# 市場（販売先の国）ごとの設定
# -----------------------------------------------------------------------------
# ★ここの数字は「あなたのアカウントの実数」に必ず置き換えてください。
#   Shopee の手数料率・送料表はプログラム(SIP/CBSL)や期間キャンペーンで変わります。
#   確認先: Seller Centre > マイ収益 / 手数料 のページ、および SLS 料金表。
#   数字を直したら updated_at の日付も直すこと（古いと警告が出ます）。
# =============================================================================

defaults:
  # 為替レートが何日前まで有効とみなすか（超えると計算スクリプトが警告）
  fx_max_age_days: 14
  # 国際送料の計算に使う容積重量の除数（航空便の一般値。SLS料金表に合わせて調整）
  volumetric_divisor: 6000
  # 請求重量の丸め単位（g）。多くの料金表は 100g 刻み。
  weight_step_g: 100

markets:
  # ---------------------------------------------------------------------------
  # 台湾：日本発クロスボーダーで最大の市場。日本製ベビー用品の人気が高い。
  # ---------------------------------------------------------------------------
  TW:
    name_ja: 台湾
    currency: TWD
    listing_language: zh-Hant   # 出品文は繁体字中国語
    cs_language: zh-Hant
    fx:
      jpy_per_unit: 4.80        # 1 TWD = ? JPY  ★要更新
      updated_at: 2026-09-21
    # 販売額にかかる率（小数。0.06 = 6%）★要更新
    fees:
      commission_rate: 0.06       # 販売手数料
      transaction_fee_rate: 0.02  # 決済手数料
      service_fee_rate: 0.00      # 有料プログラム(無料配送等)に入っている場合のみ
      fixed_fee_local: 0.0        # 1注文あたり固定手数料（現地通貨）
    # SLS 国際送料（請求重量ベース）★要更新
    shipping:
      base_jpy: 180.0           # 1個あたりの基本料
      per_kg_jpy: 950.0         # 1kgあたり
      max_weight_kg: 20.0       # これを超えると出品不可扱い
    pricing:
      psychological_ending: 9   # 末尾を9に寄せる（399, 599 など）
      round_to: 1               # 価格の丸め単位（現地通貨）
    notes: |
      ・繁体字で書くこと（簡体字はNG。信頼を落とす）
      ・「日本製 / 日本原裝」は強い訴求だが、事実でない場合は絶対に書かない
      ・送料無料ライン（台湾は無料配送プログラムの閾値）を意識した価格設計が効く

  # ---------------------------------------------------------------------------
  # シンガポール：単価が高く英語で完結。まず台湾→次の候補。
  # ---------------------------------------------------------------------------
  SG:
    name_ja: シンガポール
    currency: SGD
    listing_language: en
    cs_language: en
    fx:
      jpy_per_unit: 115.0       # ★要更新
      updated_at: 2026-09-21
    fees:
      commission_rate: 0.06
      transaction_fee_rate: 0.02
      service_fee_rate: 0.00
      fixed_fee_local: 0.0
    shipping:
      base_jpy: 220.0
      per_kg_jpy: 1250.0
      max_weight_kg: 20.0
    pricing:
      psychological_ending: 9
      round_to: 0.1
    notes: |
      ・単価が高いので高付加価値品（オーガニック、日本ブランド）向き
      ・購買層の英語リテラシーが高く、説明文の質がそのままCVRに出る

  # ---------------------------------------------------------------------------
  # マレーシア：量は出るが価格競争が激しい。薄利多売向け。
  # ---------------------------------------------------------------------------
  MY:
    name_ja: マレーシア
    currency: MYR
    listing_language: en
    cs_language: en
    fx:
      jpy_per_unit: 34.0        # ★要更新
      updated_at: 2026-09-21
    fees:
      commission_rate: 0.06
      transaction_fee_rate: 0.02
      service_fee_rate: 0.00
      fixed_fee_local: 0.0
    shipping:
      base_jpy: 200.0
      per_kg_jpy: 1100.0
      max_weight_kg: 20.0
    pricing:
      psychological_ending: 9
      round_to: 0.1
    notes: |
      ・ハラル認証の有無を気にする顧客がいる（特に口に入るもの・スキンケア）
      ・価格競争が激しいので、原価が高い日本仕入れ品は勝ちにくい商材もある
